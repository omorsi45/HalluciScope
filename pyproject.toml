[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[project]
name = "halluciscope"
version = "0.1.0"
description = "Multi-signal hallucination detection for RAG question-answering"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "langchain-text-splitters==1.1.3",
    "sentence-transformers==6.2.0",
    "transformers==5.20.2",
    "torch==2.14.1",
    "httpx==0.28.1",
    "aiosqlite==0.22.1",
    "typer==0.27.3",
    "rich==15.0.0",
    "pypdf==6.21.2",
    "python-multipart==0.0.32",
    "numpy==2.5.4",
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3",
    "pgvector==0.5.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.2",
]
eval = [
    "matplotlib==3.11.2",
]

[project.scripts]
halluciscope = "backend.cli.main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["pg: needs local Postgres", "models: loads real ML models"]
addopts = "-m 'not models'"

[tool.ruff]
target-version = "py311"
line-length = 100
